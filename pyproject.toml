[build-system]
requires = ["setuptools>=77"]  # 77+: PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "cspm-triage"
version = "0.1.0"
description = "Triage, diff, and report on Prowler OCSF scan results."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
cspm-triage = "cspm_triage.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit"]

[tool.setuptools]
packages = ["cspm_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]